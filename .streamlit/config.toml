[theme]
base = "light"
primaryColor = "#3b82f6"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = false
enableCORS = false
enableXsrfProtection = false

[client]
# 'Oh no' 대신 실제 에러 traceback을 화면에 표시 (디버깅)
showErrorDetails = "full"
